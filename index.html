<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3b1f8f"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>Heads Up! Free</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;font-family:system-ui,Arial,sans-serif;background:#3b1f8f;color:#fff;overflow:hidden}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:16px;overflow-y:auto}
.screen.on{display:flex}
h1{color:#ffd400;margin:8px 0;font-size:2.2em;text-shadow:3px 3px 0 #000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;width:100%;max-width:900px}
.cat{border:0;border-radius:16px;padding:22px 8px;font-size:1.1em;font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35)}
button.big{border:0;border-radius:14px;padding:14px 26px;font-size:1.2em;font-weight:bold;background:#ffd400;color:#3b1f8f;margin:6px;cursor:pointer}
#play{justify-content:center;padding:0}
#word{font-size:min(16vw,22vh);font-weight:900;text-align:center;padding:0 4vw;line-height:1.05;text-shadow:4px 4px 0 rgba(0,0,0,.4)}
#timer{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:1.6em;font-weight:bold}
#hint{position:absolute;bottom:10px;width:100%;text-align:center;opacity:.7;font-size:.9em}
.flash-g{background:#1fb84a!important}.flash-o{background:#ff8a00!important}
#landscape{display:none;position:fixed;inset:0;background:#000d;z-index:9;align-items:center;justify-content:center;text-align:center;font-size:1.5em;padding:20px}
@media (orientation:portrait){body.playing #landscape{display:flex}}
textarea{width:100%;max-width:600px;height:40vh;font-size:1em;border-radius:10px;padding:10px}
ul{columns:2;max-width:700px;width:100%}li{margin:3px 0}.ok{color:#7dff9b}.ps{color:#ffb35c;text-decoration:line-through}
#perm{display:none}
</style></head><body>
<div id="landscape">📱↻<br>Turn your phone sideways (landscape) please!</div>
<section id="menu" class="screen on"><h1>HEADS UP!</h1>
<p style="margin:0 0 10px;text-align:center">Pick a deck, hold the phone on your forehead. Tilt <b>down</b> = correct, tilt <b>up</b> = pass. Or tap right/left.</p>
<button id="perm" class="big">Enable Tilt Controls</button>
<div class="grid" id="cats"></div></section>
<section id="custom" class="screen"><h1>Custom Deck</h1><p>One word or phrase per line (saved on this phone):</p>
<textarea id="customText"></textarea><div><button class="big" id="saveCustom">Save &amp; Play</button><button class="big" id="backCustom">Back</button></div></section>
<section id="play" class="screen"><div id="timer"></div><div id="word"></div><div id="hint">Tap right = ✔ correct · Tap left = ✖ pass</div></section>
<section id="end" class="screen"><h1 id="score"></h1><ul id="results"></ul><div><button class="big" id="again">Play Again</button><button class="big" id="home">Categories</button></div></section>
<script>
const D={
"Animals":"Dog,Cat,Elephant,Giraffe,Kangaroo,Penguin,Lion,Tiger,Zebra,Monkey,Gorilla,Panda,Koala,Sloth,Octopus,Shark,Dolphin,Whale,Eagle,Owl,Parrot,Flamingo,Snake,Crocodile,Frog,Turtle,Rabbit,Squirrel,Hedgehog,Bat,Camel,Horse,Cow,Pig,Chicken,Duck,Goat,Sheep,Bear,Wolf,Fox,Deer,Moose,Raccoon,Peacock,Jellyfish,Lobster,Butterfly,Bee,Spider",
"Movies":"Frozen,Toy Story,The Lion King,Finding Nemo,Shrek,Star Wars,Jurassic Park,Harry Potter,The Wizard of Oz,Home Alone,Back to the Future,E.T.,Jaws,Titanic,Cars,Up,Moana,Coco,Encanto,Aladdin,Beauty and the Beast,The Incredibles,Ratatouille,Monsters Inc.,Inside Out,Zootopia,Despicable Me,Minions,Kung Fu Panda,Madagascar,Ghostbusters,Spider-Man,Batman,Superman,The Avengers,Black Panther,Mary Poppins,The Lego Movie,Night at the Museum,Paddington,Matilda,Elf,Space Jam,The Little Mermaid,Cinderella",
"Celebrities":"Taylor Swift,Beyoncé,Oprah,Tom Hanks,Dwayne Johnson,Will Smith,Michael Jordan,LeBron James,Serena Williams,Lady Gaga,Elvis Presley,Michael Jackson,Adele,Ed Sheeran,Justin Bieber,Ariana Grande,Selena Gomez,Kim Kardashian,Jennifer Lopez,Shakira,Rihanna,Drake,Snoop Dogg,Elon Musk,Bill Gates,Steve Jobs,Albert Einstein,Abraham Lincoln,Marilyn Monroe,Leonardo DiCaprio,Brad Pitt,Jim Carrey,Ryan Reynolds,Keanu Reeves,Morgan Freeman,Dolly Parton,Gordon Ramsay,Tom Brady,Simone Biles,Shaquille O'Neal,Jackie Chan,Zendaya,Billie Eilish,Mr. Beast",
"Food":"Pizza,Hamburger,Hot Dog,Taco,Burrito,Sushi,Spaghetti,Mac and Cheese,French Fries,Pancakes,Waffles,Bacon,Ice Cream,Cupcake,Donut,Cookie,Popcorn,Pretzel,Banana,Apple,Watermelon,Pineapple,Strawberry,Grapes,Corn on the Cob,Broccoli,Carrot,Potato,Grilled Cheese,Peanut Butter,Cereal,Burrito Bowl,Nachos,Chicken Nuggets,Meatballs,Lasagna,Cheesecake,S'mores,Lollipop,Cotton Candy,Bubble Gum,Avocado,Lemonade,Milkshake,Bagel",
"Act It Out":"Brushing teeth,Riding a bike,Swimming,Playing guitar,Taking a selfie,Walking a dog,Fishing,Bowling,Surfing,Juggling,Doing yoga,Baking a cake,Changing a diaper,Mowing the lawn,Skiing,Climbing a ladder,Playing piano,Driving a car,Flying a kite,Washing dishes,Sneezing,Yawning,Tightrope walking,Being a zombie,Being a robot,Boxing,Ice skating,Painting a wall,Blowing bubbles,Reading a book,Jump rope,Karate,Rowing a boat,Milking a cow,Shaving,Typing,Hula hoop,Cheerleading,Conducting an orchestra,Walking on the moon",
"Sports":"Soccer,Basketball,Football,Baseball,Tennis,Golf,Hockey,Volleyball,Swimming,Boxing,Wrestling,Gymnastics,Skateboarding,Surfing,Snowboarding,Skiing,Bowling,Cycling,Track and Field,Marathon,Badminton,Table Tennis,Archery,Fencing,Rugby,Cricket,Lacrosse,Karate,Figure Skating,Horse Racing,NASCAR,Sumo,Rock Climbing,Dodgeball,Kickball,Cheerleading,Pole Vault,Water Polo,Diving,Curling,Pickleball,Frisbee",
"Accents/Characters":"Pirate,Cowboy,Robot,Vampire,Queen of England,Australian surfer,Southern grandma,French chef,Italian pizza maker,Valley girl,Surfer dude,Sports announcer,News anchor,Wizard,Fairy godmother,Superhero,Villain,Zombie,Ghost,Caveman,Baby,Grumpy old man,Game show host,Drill sergeant,Opera singer,Rapper,Yoda,Darth Vader,Mickey Mouse,SpongeBob,Elmo,Santa Claus,Easter Bunny,Tooth Fairy,Knight,Ninja,Detective,Mad scientist,Cheerleader,Gym coach,Flight attendant,Waiter",
"90s Throwback":"Tamagotchi,Furby,Pokémon,Game Boy,Nintendo 64,Beanie Babies,Pogs,Slap Bracelet,Walkman,Discman,VHS Tape,Blockbuster,Dial-up Internet,AOL,Pager,Spice Girls,Backstreet Boys,NSYNC,Britney Spears,Macarena,Friends,Seinfeld,Fresh Prince,Full House,Saved by the Bell,Rugrats,Power Rangers,Teenage Mutant Ninja Turtles,Space Jam,Titanic,Jurassic Park,Lion King,Toy Story,Scrunchie,Butterfly Clips,Lisa Frank,Gak,Bop It,Super Soaker,Rollerblades,Tetris,Sonic the Hedgehog,Pokémon Cards,Spice Girls,Hacky Sack"
};
const COLORS=["#e6194b","#3cb44b","#f58231","#4363d8","#911eb4","#008080","#c2185b","#795548","#455a64"];
const $=id=>document.getElementById(id);let deck=[],cards=[],idx=0,res=[],time=60,tmr=null,state="menu",lock=false,neutral=true,wake=null,lastCat=null,ac=null;
function show(s){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));$(s).classList.add('on');document.body.classList.toggle('playing',s==='play')}
function getCustom(){return (localStorage.getItem('hu_custom')||'').split('\n').map(s=>s.trim()).filter(Boolean)}
const cats=$('cats');Object.keys(D).concat(['Custom']).forEach((c,i)=>{const b=document.createElement('button');b.className='cat';b.textContent=c;b.style.background=COLORS[i%COLORS.length];b.onclick=()=>pick(c);cats.appendChild(b)});
if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')$('perm').style.display='inline-block';
$('perm').onclick=async()=>{try{const r=await DeviceOrientationEvent.requestPermission();$('perm').textContent=r==='granted'?'Tilt Enabled ✔':'Tilt denied – use taps';}catch(e){$('perm').textContent='Tilt unavailable – use taps'}};
async function askPerm(){if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){try{await DeviceOrientationEvent.requestPermission()}catch(e){}}}
function pick(c){if(c==='Custom'){$('customText').value=localStorage.getItem('hu_custom')||'';show('custom');return}lastCat=c;start(D[c].split(','))}
$('saveCustom').onclick=()=>{localStorage.setItem('hu_custom',$('customText').value);const w=getCustom();if(w.length<1){alert('Add some words first!');return}lastCat='Custom';start(w)};
$('backCustom').onclick=()=>show('menu');
function shuffle(a){a=[...new Set(a)];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function beep(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}}
async function start(words){askPerm();beep(1,.01);try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){}
try{if(screen.orientation&&screen.orientation.lock){document.documentElement.requestFullscreen&&await document.documentElement.requestFullscreen().catch(()=>{});await screen.orientation.lock('landscape').catch(()=>{})}}catch(e){}
cards=shuffle(words);idx=0;res=[];time=60;show('play');state='count';let n=3;$('timer').textContent='';$('word').textContent='Place on forehead…';
setTimeout(function cd(){if(n>0){$('word').textContent=n;beep(600,.15);n--;setTimeout(cd,1000)}else{beep(900,.3);state='play';neutral=true;next();$('timer').textContent=time;tmr=setInterval(()=>{time--;$('timer').textContent=time;if(time<=5&&time>0)beep(500,.08);if(time<=0)end()},1000)}},1500)}
function next(){if(idx>=cards.length){end();return}$('word').textContent=cards[idx]}
function answer(ok){if(state!=='play'||lock)return;lock=true;res.push({w:cards[idx],ok});const p=$('play');p.classList.add(ok?'flash-g':'flash-o');$('word').textContent=ok?'CORRECT!':'PASS';beep(ok?880:220,ok?.2:.35);navigator.vibrate&&navigator.vibrate(ok?80:[40,40,40]);
setTimeout(()=>{p.classList.remove('flash-g','flash-o');idx++;lock=false;if(state==='play')next()},800)}
function end(){if(state!=='play'&&state!=='count')return;state='end';clearInterval(tmr);beep(300,.6);navigator.vibrate&&navigator.vibrate(300);try{wake&&wake.release();wake=null}catch(e){}
const c=res.filter(r=>r.ok).length;$('score').textContent='Score: '+c;$('results').innerHTML=res.map(r=>`<li class="${r.ok?'ok':'ps'}">${r.ok?'✔':'✖'} ${r.w.replace(/</g,'&lt;')}</li>`).join('')||'<li>No cards played</li>';show('end')}
$('play').addEventListener('click',e=>{if(state==='play')answer(e.clientX>innerWidth/2)});
window.addEventListener('deviceorientation',e=>{if(state!=='play'||e.gamma==null)return;const g=e.gamma;// landscape on forehead: gamma ~ ±90 upright
const a=Math.abs(g);if(a>65){neutral=true;return}if(!neutral||a>35)return;
// near 0 means face tipped up or down; use beta sign to tell which
const flip=Math.abs(e.beta)>90;const down=(g>0)!==flip;neutral=false;answer(down)});
$('again').onclick=()=>pick(lastCat==='Custom'?'Custom':lastCat);$('home').onclick=()=>show('menu');
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&state==='play'&&navigator.wakeLock){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}});
</script></body></html>
